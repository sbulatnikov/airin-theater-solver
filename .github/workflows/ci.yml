name: CI

on:
  push:
    branches:
      - "dependabot/**"
      - "feat/**"
      - "fix/**"
      - "rc/**"
      - "hotfix/**"
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Install dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prime dependency cache
        uses: ./.github/actions/setup-workspace
        with:
          offline: "false"

  lint:
    name: Lint
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore workspace
        uses: ./.github/actions/setup-workspace
      - name: Biome lint and formatting
        run: pnpm check

  typecheck:
    name: Typecheck
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore workspace
        uses: ./.github/actions/setup-workspace
      - name: TypeScript and Vue
        run: pnpm typecheck

  unit:
    name: Unit tests
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore workspace
        uses: ./.github/actions/setup-workspace
      - name: Vitest
        run: pnpm test:unit

  build:
    name: Build
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore workspace
        uses: ./.github/actions/setup-workspace
      - name: Production build contracts
        run: pnpm build

  e2e:
    name: E2E tests
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore workspace
        uses: ./.github/actions/setup-workspace
      - name: Build application for E2E
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
