name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test and build
        run: pnpm test

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  freeze:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rc/')
    environment:
      name: release-freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_tag: ${{ steps.candidate.outputs.release_tag }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate release candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_BRANCH: ${{ github.ref_name }}
        run: |
          candidate="${RC_BRANCH#rc/}"
          if [[ ! "$candidate" =~ ^(20[0-9]{2}\.[1-9][0-9]*(\.[1-9][0-9]*)?)-rc\.([1-9][0-9]*)$ ]]; then
            echo "Invalid RC branch: $RC_BRANCH" >&2
            exit 1
          fi
          base_release="${BASH_REMATCH[1]}"
          node scripts/verify-release-tag.mjs "$candidate"
          git rev-parse --verify "refs/tags/${base_release}^{commit}" >/dev/null
          git merge-base --is-ancestor "$base_release" "$GITHUB_SHA"
          if git rev-parse --verify --quiet "refs/tags/${candidate}" >/dev/null; then
            echo "Candidate tag already exists: $candidate" >&2
            exit 1
          fi

          rc_prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '[.[] | select(.head.ref | startswith("rc/")) | .head.ref] | unique | .[]')"
          if [[ "$rc_prs" != "$RC_BRANCH" ]]; then
            echo "Freeze requires exactly one open RC PR for $RC_BRANCH; found: ${rc_prs:-none}" >&2
            exit 1
          fi
          echo "release_tag=$candidate" >> "$GITHUB_OUTPUT"

      - name: Lock candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          RC_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "REPOSITORY_ADMIN_TOKEN is not configured in the release-freeze environment." >&2
            exit 1
          fi
          encoded_branch="${RC_BRANCH//\//%2F}"
          payload='{"required_status_checks":null,"enforce_admins":true,"required_pull_request_reviews":null,"restrictions":null,"required_linear_history":true,"allow_force_pushes":false,"allow_deletions":false,"block_creations":false,"required_conversation_resolution":true,"lock_branch":true,"allow_fork_syncing":false}'
          printf '%s' "$payload" | gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}/protection" --input -

      - name: Create immutable candidate tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
        run: |
          tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Airin Theater Solver $RELEASE_TAG" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object"

  publish-candidate:
    needs: freeze
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.freeze.outputs.release_tag }}
