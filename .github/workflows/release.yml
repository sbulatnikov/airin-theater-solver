name: Publish repository release

on:
  push:
    tags:
      - "20*.*"
  workflow_call:
    inputs:
      release_tag:
        description: Existing repository release tag
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test and build
        run: pnpm test

      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts/package
          cp -R dist/. release-artifacts/package/
          cp CHANGES.md release-artifacts/package/CHANGES.md
          cp dist/v1/index.html "release-artifacts/airin-theater-solver-v1-${RELEASE_TAG}.html"
          cp dist/v2/index.html "release-artifacts/airin-theater-solver-v2-${RELEASE_TAG}.html"
          cp CHANGES.md release-artifacts/CHANGES.md
          tar -czf "release-artifacts/airin-theater-solver-${RELEASE_TAG}.tar.gz" -C release-artifacts/package .
          rm -rf release-artifacts/package
          cd release-artifacts
          sha256sum CHANGES.md *.html *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        run: |
          flags=(--verify-tag --notes-file CHANGES.md --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" release-artifacts/* "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
