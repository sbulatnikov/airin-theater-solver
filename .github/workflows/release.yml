name: Release main

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  classify:
    name: Classify main update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.classify.outputs.should_release }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          offline: "false"
      - name: Resolve source Pull Request
        id: classify
        run: pnpm exec tsx scripts/release/classify-main-update.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tag:
    name: Create stable tag
    needs: classify
    if: needs.classify.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          offline: "false"

      - name: Validate Change Log and create stable tag
        id: release
        run: pnpm exec tsx scripts/release/create-stable-tag.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  artifacts:
    name: Build release artifacts
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      PREVIOUS_TAG: ${{ needs.tag.outputs.previous_tag }}
      RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          offline: "false"

      - name: Build application
        run: pnpm build

      - name: Package release artifacts
        run: bash scripts/release/package-release.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish-release.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy release to Pages
    needs: artifacts
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
