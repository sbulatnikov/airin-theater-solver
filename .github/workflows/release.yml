name: Release main

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Create stable tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Resolve stable release
        id: release
        shell: bash
        run: |
          mapfile -t current_tags < <(git tag --points-at "$GITHUB_SHA" --list '20*' | \
            grep -E '^20[0-9]{2}\.[1-9][0-9]*(\.[1-9][0-9]*)?$')
          if [[ "${#current_tags[@]}" -gt 1 ]]; then
            echo "Commit already has several stable tags: ${current_tags[*]}" >&2
            exit 1
          fi

          if [[ "${#current_tags[@]}" -eq 1 ]]; then
            release_tag="${current_tags[0]}"
            node scripts/verify-release-tag.mjs "$release_tag"
          else
            latest_stable="$(git tag --list '20*' --sort=-version:refname | \
              grep -E '^20[0-9]{2}\.[1-9][0-9]*(\.[1-9][0-9]*)?$' | head -1)"
            if [[ -z "$latest_stable" ]]; then
              echo "No stable repository tag exists." >&2
              exit 1
            fi
            release_tag="$(node scripts/resolve-main-release.mjs "$latest_stable")"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create immutable stable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" == "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to this commit."
              exit 0
            fi
            echo "Tag $RELEASE_TAG already points to another commit." >&2
            exit 1
          fi

          tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Airin Theater Solver $RELEASE_TAG" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object"

  artifacts:
    name: Build release artifacts
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build application
        run: pnpm build

      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/airin-theater-solver-${RELEASE_TAG}.tar.gz" -C dist .
          cp CHANGES.md release-artifacts/CHANGES.md
          cd release-artifacts
          sha256sum CHANGES.md *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file CHANGES.md --title "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --latest \
              --notes-file CHANGES.md \
              --title "$RELEASE_TAG" \
              --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy release to Pages
    needs: artifacts
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
