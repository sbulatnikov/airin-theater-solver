name: RC Code Freeze

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - "rc/**"

permissions: {}

concurrency:
  group: rc-freeze-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  freeze:
    name: Code Freeze
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: release-freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Validate release candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RC_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          candidate="${RC_BRANCH#rc/}"
          if [[ ! "$candidate" =~ ^(20[0-9]{2}\.[1-9][0-9]*(\.[1-9][0-9]*)?)-rc\.([1-9][0-9]*)$ ]]; then
            echo "Invalid RC branch: $RC_BRANCH" >&2
            exit 1
          fi

          base_release="${BASH_REMATCH[1]}"
          latest_stable="$(git tag --list '20*' --sort=-version:refname | grep -E '^20[0-9]{2}\.[1-9][0-9]*(\.[1-9][0-9]*)?$' | head -1)"
          if [[ "$base_release" != "$latest_stable" ]]; then
            echo "RC is based on $base_release, but latest stable is $latest_stable." >&2
            exit 1
          fi

          node scripts/verify-release-tag.mjs "$candidate"
          git merge-base --is-ancestor "$base_release" "$RC_SHA"
          if git rev-parse --verify --quiet "refs/tags/${candidate}" >/dev/null; then
            echo "Candidate tag already exists: $candidate" >&2
            exit 1
          fi

          mapfile -t rc_prs < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("rc/")) | .head.ref' | sort -u)
          if [[ "${#rc_prs[@]}" -ne 1 || "${rc_prs[0]}" != "$RC_BRANCH" ]]; then
            printf 'Freeze requires one open RC PR for %s; found: %s\n' \
              "$RC_BRANCH" "${rc_prs[*]:-none}" >&2
            exit 1
          fi

          echo "release_tag=$candidate" >> "$GITHUB_OUTPUT"

      - name: Lock candidate branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          RC_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "REPOSITORY_ADMIN_TOKEN is not configured in the release-freeze environment." >&2
            exit 1
          fi

          encoded_branch="${RC_BRANCH//\//%2F}"
          payload='{"required_status_checks":null,"enforce_admins":true,"required_pull_request_reviews":null,"restrictions":null,"required_linear_history":true,"allow_force_pushes":false,"allow_deletions":false,"block_creations":false,"required_conversation_resolution":true,"lock_branch":true,"allow_fork_syncing":false}'
          printf '%s' "$payload" | gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}/protection" --input -

      - name: Create immutable candidate tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.candidate.outputs.release_tag }}
        run: |
          tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Airin Theater Solver $RELEASE_TAG" \
            -f object="$RC_SHA" \
            -f type=commit \
            --jq .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object"
